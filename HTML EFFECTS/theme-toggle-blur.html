<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Collected and customized from https://github.com/rudrodip/theme-toggle-effect -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CIRCULAR BLUR</title>
  <style>
    /* Define custom easing functions for the view transition.
      These linear() functions create a smooth, "expo" style animation curve.
    */
    :root {
      --expo-in: linear(
      0 0%, 0.0085 31.26%, 0.0167 40.94%,
      0.0289 48.86%, 0.0471 55.92%,
      0.0717 61.99%, 0.1038 67.32%,
      0.1443 72.07%, 0.1989 76.7%,
      0.2659 80.89%, 0.3465 84.71%,
      0.4419 88.22%, 0.554 91.48%,
      0.6835 94.51%, 0.8316 97.34%, 1 100%
      );
      --expo-out: linear(
        0 0%, 0.1684 2.66%, 0.3165 5.49%,
        0.446 8.52%, 0.5581 11.78%,
        0.6535 15.29%, 0.7341 19.11%,
        0.8011 23.3%, 0.8557 27.93%,
        0.8962 32.68%, 0.9283 38.01%,
        0.9529 44.08%, 0.9711 51.14%,
        0.9833 59.06%, 0.9915 68.74%, 1 100%
      );
      
      /* Set default (light) theme colors */
      color-scheme: light;
      background-color: #f0f0f0;
      color: #333;
    }
    
    /* Dark theme styles applied when the 'dark' class is present on the html element */
    .dark {
      color-scheme: dark;
      background-color: #333;
      color: #f0f0f0;
    }

    /* Apply the custom easing function to the view transition group */
    ::view-transition-group(root) {
      animation-timing-function: var(--expo-out);
    }

    /* Style the new view during the transition */
    ::view-transition-new(root) {
      /* This is the key change: mask image now starts at the top-right corner */
      mask: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40"><defs><filter id="blur"><feGaussianBlur stdDeviation="2"/></filter></defs><circle cx="40" cy="0" r="18" fill="white" filter="url(%23blur)"/></svg>') top right / 0 no-repeat;
      mask-origin: content-box;
      animation: scale 1s;
      
      /* Change the transform origin to match the mask origin */
      transform-origin: top right;
    }

    /* Style the old view during the transition */
    ::view-transition-old(root),
    .dark::view-transition-old(root) {
      animation: scale 1s;
      
      /* Change the transform origin to match the new animation direction */
      transform-origin: top right;
      z-index: -1;
    }

    /* Keyframe animation for the scaling effect */
    @keyframes scale {
      to {
        mask-size: 350vmax;
      }
    }

    /* Basic body and button styles for a clean look */
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      font-family: sans-serif;
      transition: background-color 0.5s, color 0.5s;
    }

    button {
      padding: 10px 20px;
      margin-top: 20px;
      font-size: 16px;
      cursor: pointer;
      border: 1px solid #ccc;
      border-radius: 5px;
      background-color: #fff;
      color: #333;
    }

    .dark button {
      background-color: #444;
      color: #f0f0f0;
    }

  </style>
</head>
<body>

  <h2>HELLO WORLD</h2>
  <button id="theme-toggle">Switch Theme</button>

  <script>
    const themeToggleBtn = document.getElementById('theme-toggle');
    const htmlElement = document.documentElement;

    function switchTheme() {
      htmlElement.classList.toggle('dark');
    }

    themeToggleBtn.addEventListener('click', () => {
      // Check if View Transitions API is supported
      if (document.startViewTransition) {
        document.startViewTransition(() => {
          switchTheme();
        });
      } else {
        // Fallback for browsers that don't support the API
        switchTheme();
      }
    });

  </script>
</body>
</html>
